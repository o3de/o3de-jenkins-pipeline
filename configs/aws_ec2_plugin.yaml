        remoteFS: "c:/ly"
        securityGroups: "sg-02861eb82b97b4d53, sg-0f8806ae5fa713ccb"
        stopOnTerminate: false
        subnetId: "subnet-04f016990a8d061d6"
        t2Unlimited: false
        tags:
        - name: "Name"
          value: "Signing_WIN2019_INC_4"
